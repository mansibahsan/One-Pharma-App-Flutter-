<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="120" y1="80" x2="904" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6573"/>
      <stop offset="52%" stop-color="#FF4858"/>
      <stop offset="100%" stop-color="#D92D3E"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="512" y1="0" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="152" y="168" width="720" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#7A0B18" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheenGrad)"/>

  <!-- Subtle Outer Ring -->
  <circle cx="512" cy="512" r="392" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8"/>

  <!-- Medical Cross -->
  <g filter="url(#softShadow)">
    <rect x="408" y="212" width="208" height="600" rx="68" fill="#FFFFFF"/>
    <rect x="212" y="408" width="600" height="208" rx="68" fill="#FFFFFF"/>
  </g>

  <!-- Center Pharmacy Medallion -->
  <circle cx="512" cy="512" r="112" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="112" stroke="#FFFFFF" stroke-width="10"/>

  <!-- Two-Tone Tilted Capsule -->
  <g transform="rotate(-45 512 512)">
    <!-- Upper Half (White) -->
    <path d="M464 468C464 441.49 485.49 420 512 420C538.51 420 560 441.49 560 468V512H464V468Z" fill="#FFFFFF"/>
    <!-- Lower Half (Amber Gold) -->
    <path d="M464 512H560V556C560 582.51 538.51 604 512 604C485.49 604 464 582.51 464 556V512Z" fill="#FFB800"/>
    <!-- Capsule Gloss Highlight -->
    <rect x="480" y="446" width="14" height="48" rx="7" fill="#FF4858" fill-opacity="0.18"/>
  </g>
</svg>

